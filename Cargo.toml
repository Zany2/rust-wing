[workspace]
default-members = ["rust-wing-core", "rust-wing-adapter", "rust-wing-axum"]
members = [
    "rust-wing-core",
    "rust-wing-adapter",
    "rust-wing-axum",
    "rust-wing-example",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
dashmap = "6"
futures-util = "0.3"
redis = { version = "1.0.4", default-features = false, features = ["aio", "tokio-comp", "connection-manager"] }
rust-wing-core = { path = "rust-wing-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
